<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإدارة — نظام الحضور</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }

body { font-family:'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { background:var(--teal); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(2,128,122,.3); }
.logo { height:36px; filter:brightness(0) invert(1); }
.ht { flex:1; }
.ht h1 { font-size:15px; font-weight:700; }
.ht p  { font-size:11px; opacity:.8; }
.nav { display:flex; gap:6px; }
.nav a, .nav button { background:rgba(255,255,255,.15); border:none; color:#fff; padding:6px 12px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; font-family:inherit; }
.nav a:hover, .nav button:hover { background:rgba(255,255,255,.28); }
main { padding:16px; max-width:960px; margin:0 auto; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:640px){ .grid2 { grid-template-columns:1fr; } }
.card { background:var(--white); border-radius:var(--radius); border:1px solid #E0F2F1; padding:18px; margin-bottom:14px; box-shadow:0 1px 4px rgba(2,128,122,.06); }
.card-title { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.07em; margin-bottom:14px; text-transform:uppercase; display:flex; align-items:center; justify-content:space-between; }
.fg { margin-bottom:11px; }
label { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:5px; }
input, select { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:14px; font-family:inherit; background:#FAFFFE; color:var(--text); transition:border-color .2s; }
input[type="time"] {
  font-variant-numeric: tabular-nums;
  cursor: text;
  -webkit-appearance: none; /* يُزيل الشكل الافتراضي على iOS */
  appearance: none;
}
/* أيقونة الساعة — تفتح الـ picker عند الضغط */
input[type="time"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
  opacity: .55;
  pointer-events: auto; /* مهم: لا تمنع الضغط */
  margin-right: 2px;
}
/* تأكيد: لا يوجد عنصر يحجب الحقل */
input[type="time"]:hover {
  border-color: var(--teal2);
}
input:focus, select:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(2,128,122,.1); }
.btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 16px; border:none; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; width:100%; margin-top:8px; transition:all .2s; }
.btn-primary   { background:var(--teal); color:#fff; }
.btn-danger    { background:var(--danger-bg); color:var(--danger); border:1px solid #FCA5A5; }
.btn-archive   { background:#FFFBEB; color:#92400E; border:1px solid #FCD34D; }
.btn-sm { padding:4px 11px; font-size:12px; border-radius:6px; border:none; cursor:pointer; font-family:inherit; font-weight:600; }
.btn-activate   { background:var(--success-bg); color:var(--success); }
.btn-deactivate { background:var(--danger-bg); color:var(--danger); }
.btn-qr { background:#EDE9FE; color:#5B21B6; }
.btn-edit-sm { background:#E0F2F1; color:var(--teal); }
.btn-del-sm  { background:var(--danger-bg); color:var(--danger); }
/* Workshop list */
.ws-item { border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:8px; display:flex; align-items:center; gap:9px; cursor:pointer; transition:all .2s; }
.ws-item:hover { border-color:var(--teal2); background:#F9FFFE; }
.ws-item.selected { border-color:var(--teal); background:#ECFDF5; }
.ws-icon { width:34px; height:34px; border-radius:8px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.ws-info { flex:1; min-width:0; }
.ws-name { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ws-meta { font-size:11px; color:var(--muted); margin-top:1px; }
.ws-actions { display:flex; gap:4px; flex-shrink:0; }
/* QR rows */
.qr-row { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:7px; display:flex; align-items:center; gap:8px; }
.qr-day { width:32px; height:32px; border-radius:8px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--teal); flex-shrink:0; }
.qr-info { flex:1; }
.qr-title    { font-weight:600; font-size:13px; }
.qr-ws-label   { font-size:11px; color:var(--teal); font-weight:500; margin:1px 0; }
.qr-date       { font-size:11px; color:var(--muted); }
.qr-att-count  { font-size:11px; color:var(--success); font-weight:600; margin-top:2px; }
.qr-acts  { display:flex; gap:4px; }
.badge { font-size:11px; padding:2px 8px; border-radius:99px; font-weight:600; }
.badge-active   { background:var(--success-bg); color:var(--success); }
.badge-inactive { background:#F3F4F6; color:var(--muted); }
.badge-archived { background:#FFFBEB; color:#92400E; }
/* Toast */
.toast { background:var(--success-bg); border:1px solid #6EE7B7; border-radius:8px; padding:9px 13px; font-size:13px; color:var(--success); margin-top:9px; display:none; animation:fadeIn .3s; }
.toast.error  { background:var(--danger-bg); border-color:#FCA5A5; color:var(--danger); }
.toast.show   { display:block; }
/* Confirm modal */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(3px); }
.overlay.show { display:flex; }
.modal { background:var(--white); border-radius:var(--radius); width:100%; max-width:340px; overflow:hidden; animation:slideUp .28s; }
.modal-head { padding:16px 18px; border-bottom:1px solid var(--border); }
.modal-head h3 { font-size:15px; font-weight:700; }
.modal-body { padding:16px 18px; font-size:14px; color:var(--muted); line-height:1.6; }
.modal-foot { display:flex; gap:8px; padding:0 18px 18px; }
.modal-foot .btn { margin:0; flex:1; padding:11px; font-size:14px; }
.btn-confirm-del { background:var(--danger); color:#fff; }
.btn-confirm-cancel { background:var(--bg); color:var(--muted); border:1.5px solid var(--border); }
/* QR Modal */
.qr-modal-body { padding:18px; text-align:center; }
.qr-modal-body p { font-size:12px; color:var(--muted); margin-bottom:12px; }
#qr-display { display:flex; justify-content:center; margin-bottom:12px; }
.qr-url { font-size:10px; color:var(--muted); word-break:break-all; background:var(--bg); border-radius:6px; padding:7px 10px; margin-bottom:12px; text-align:right; }
.modal-qr-foot { display:flex; gap:8px; padding:0 18px 18px; }
.modal-qr-foot .btn { margin:0; flex:1; padding:11px; }
.btn-print { background:var(--teal); color:#fff; }
.btn-close-m { background:var(--bg); color:var(--muted); border:1.5px solid var(--border); }
.empty { text-align:center; color:var(--muted); font-size:13px; padding:22px; }
/* duplicate warning */
.dup-warn { background:#FFFBEB; border:1px solid #FCD34D; border-radius:8px; padding:8px 12px; font-size:12px; color:#92400E; margin-top:8px; display:none; }
.dup-warn.show { display:block; }
@keyframes fadeIn  { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
@keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }

/* admin page */
header { background:linear-gradient(135deg,var(--teal-dark) 0%,var(--teal) 100%); color:#fff; padding:0 20px; height:58px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; box-shadow:var(--shadow-header); }
.logo { height:36px; filter:brightness(0) invert(1); flex-shrink:0; }
.logo-fb { display:none; width:36px; height:36px; border-radius:var(--radius-sm); background:rgba(255,255,255,.18); align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.ht { flex:1; }
.ht h1 { font-size:15px; font-weight:600; }
.ht p  { font-size:11px; opacity:.78; }
.nav { display:flex; gap:6px; }
.nav a, .nav button { background:rgba(255,255,255,.12); border:none; color:#fff; padding:6px 12px; border-radius:var(--radius-sm); font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; font-family:var(--font); transition:var(--transition); }
.nav a:hover, .nav button:hover { background:rgba(255,255,255,.22); }
main { padding:16px; max-width:960px; margin:0 auto; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:640px){ .grid2 { grid-template-columns:1fr; } }
.fg { margin-bottom:11px; }
.btn-sm { padding:5px 11px; font-size:12px; border-radius:var(--radius-sm); border:none; cursor:pointer; font-family:var(--font); font-weight:600; transition:var(--transition); }
.btn-activate   { background:var(--success-bg);  color:var(--success); }
.btn-deactivate { background:var(--danger-bg);   color:var(--danger);  }
.btn-qr         { background:var(--badge-override-bg); color:var(--badge-override-fg); }
.btn-edit-sm    { background:var(--teal-pale);   color:var(--teal);    }
.btn-del-sm     { background:var(--danger-bg);   color:var(--danger);  }
/* Workshop list */
.ws-item { border:1px solid var(--border-card); border-radius:var(--radius); padding:11px 13px; margin-bottom:8px; display:flex; align-items:center; gap:9px; cursor:pointer; transition:var(--transition); }
.ws-item:hover { border-color:var(--teal-light); background:var(--teal-pale); }
.ws-item.selected { border-color:var(--teal); background:var(--teal-pale); }
.ws-icon { width:34px; height:34px; border-radius:var(--radius-sm); background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.ws-info { flex:1; min-width:0; }
.ws-name { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ws-meta { font-size:11px; color:var(--text-muted); margin-top:1px; }
.ws-actions { display:flex; gap:4px; flex-shrink:0; }
/* QR rows */
.qr-row { border:1px solid var(--border-card); border-radius:var(--radius); padding:10px 12px; margin-bottom:7px; display:flex; align-items:center; gap:8px; transition:var(--transition); }
.qr-row:hover { background:var(--bg-sidebar); }
.qr-day { width:32px; height:32px; border-radius:var(--radius-sm); background:var(--teal-pale); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--teal); flex-shrink:0; }
.qr-info { flex:1; }
.qr-title    { font-weight:600; font-size:13px; }
.qr-ws-label { font-size:11px; color:var(--teal); font-weight:500; margin:1px 0; }
.qr-date     { font-size:11px; color:var(--text-muted); }
.qr-att-count { font-size:11px; color:var(--success); font-weight:600; margin-top:2px; }
.qr-acts { display:flex; gap:4px; }
.dup-warn { background:var(--warning-bg); border:1px solid var(--warning-bdr); border-radius:var(--radius); padding:8px 12px; font-size:12px; color:var(--warning); margin-top:8px; display:none; }
.dup-warn.show { display:block; }
/* Confirm modal */
.modal-head.danger { background:var(--danger-bg); border-color:var(--danger-bdr); }
.modal-head.danger h3 { color:var(--danger); }
.btn-confirm-del    { background:var(--danger); color:#fff; }
.btn-confirm-cancel { background:var(--bg); color:var(--text-muted); border:1.5px solid var(--border); }
.btn-print { background:var(--teal); color:#fff; }
.btn-close-m { background:var(--bg); color:var(--text-muted); border:1.5px solid var(--border); }
.btn-override { background:var(--teal); color:#fff; }
.btn-cancel   { background:var(--bg); color:var(--text-muted); border:1.5px solid var(--border); }
/* QR modal */
.qr-modal-body { padding:18px; text-align:center; }
.qr-url { font-size:10px; color:var(--text-muted); word-break:break-all; background:var(--bg); border-radius:var(--radius-sm); padding:7px 10px; margin-bottom:12px; }
.modal-qr-foot, .modal-foot { display:flex; gap:8px; padding:0 18px 18px; }
.modal-qr-foot .btn, .modal-foot .btn { margin:0; flex:1; padding:11px; font-size:14px; }

</style>
</head>
<body>
<header>
  <img src="logo.svg" alt="شعار" class="logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div style="display:none;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.2);align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">⚖</div>
  <div class="ht"><h1>إدارة النظام</h1><p id="org-name"></p></div>
  <div class="nav">
    <a href="dashboard.html">📊 لوحة التحكم</a>
    <a href="scanner.html">📷 المسح</a>
    <button onclick="Auth.logout()">🚪 خروج</button>
  </div>
</header>

<main>
<div class="grid2">
  <!-- يسار: الورش + QR -->
  <div>
    <div class="card">
      <div class="card-title">📁 الورش <button class="btn-sm btn-activate" onclick="loadWorkshops()" style="font-size:11px;">↻ تحديث</button></div>
      <div id="ws-list"><div class="empty">جارٍ التحميل...</div></div>
    </div>
    <div class="card" id="qr-section" style="display:none;">
      <div class="card-title">📎 رموز QR — <span id="qr-ws-name"></span></div>
      <div id="qr-list"></div>
      <button class="btn btn-primary" onclick="showQRForm()" style="margin-top:6px;">+ إضافة يوم جديد</button>
    </div>
  </div>

  <!-- يمين: إنشاء / تعديل + QR Form -->
  <div>
    <!-- بطاقة الإنشاء/التعديل -->
    <div class="card" id="ws-form-card">
      <div class="card-title" id="ws-form-title">➕ إنشاء ورشة جديدة</div>
      <input type="hidden" id="edit-ws-id">
      <div class="fg"><label>اسم الورشة</label><input type="text" id="ws-name" placeholder="مثال: ورشة الأداء المؤسسي" oninput="checkDuplicate()"></div>
      <div class="fg"><label>تاريخ البداية</label><input type="date" id="ws-start"></div>
      <div class="fg"><label>تاريخ النهاية</label><input type="date" id="ws-end"></div>
      <div class="fg"><label>الموقع</label><input type="text" id="ws-location" placeholder="قاعة الاجتماعات الرئيسية"></div>
      <div class="dup-warn" id="dup-warn">⚠️ ورشة بنفس الاسم موجودة مسبقاً — تأكدي قبل الحفظ</div>
      <button class="btn btn-primary" id="ws-save-btn" onclick="saveWorkshop()">💾 حفظ الورشة</button>
      <button class="btn btn-archive" id="ws-cancel-btn" onclick="resetWSForm()" style="display:none;">✕ إلغاء التعديل</button>
      <div class="toast" id="ws-toast"></div>
    </div>

    <!-- بطاقة إضافة يوم -->
    <div class="card" id="qr-form-card" style="display:none;">
      <div class="card-title">📎 إضافة يوم + رمز QR</div>
      <div class="fg"><label>رقم اليوم</label><input type="number" id="qr-day" min="1" value="1" oninput="checkQRDuplicate()"></div>
      <div class="fg">
        <label>اسم اليوم / العنوان <span style="color:var(--teal);font-size:11px;">(يظهر في بطاقة اليوم)</span></label>
        <input type="text" id="qr-day-name" placeholder="مثال: ورشة حوكمة البيانات — الجلسة الأولى">
      </div>
      <div class="fg"><label>تاريخ اليوم</label><input type="date" id="qr-date" oninput="checkQRDuplicate()"></div>
      <div class="fg">
        <label>بدء القبول <span style="font-size:11px;color:var(--muted);">(التاريخ من حقل تاريخ اليوم أعلاه)</span></label>
        <input type="time" id="qr-from-time">
      </div>
      <div class="fg">
        <label>انتهاء القبول</label>
        <input type="time" id="qr-until-time">
      </div>
      <div class="fg">
        <label>اعتبار متأخر بعد</label>
        <input type="time" id="qr-late-time">
      </div>
      <div class="dup-warn" id="qr-dup-warn">⚠️ يوم بنفس الرقم أو التاريخ موجود — تأكدي قبل الإضافة</div>
      <button class="btn btn-primary" onclick="createQR()">✨ توليد رمز QR</button>
      <button class="btn btn-archive" onclick="document.getElementById('qr-form-card').style.display='none'" style="margin-top:6px;">✕ إلغاء</button>
      <div class="toast" id="qr-toast"></div>
    </div>
  </div>
</div>
</main>

<!-- Confirm Delete Modal -->
<div class="overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-head"><h3 id="confirm-title">تأكيد الحذف</h3></div>
    <div class="modal-body" id="confirm-body"></div>
    <div class="modal-foot">
      <button class="btn btn-confirm-cancel" onclick="closeConfirm()">إلغاء</button>
      <button class="btn btn-confirm-del"    id="confirm-ok-btn">تأكيد</button>
    </div>
  </div>
</div>

<!-- QR Display Modal -->
<div class="overlay" id="qr-modal">
  <div class="modal">
    <div class="modal-head"><h3 id="qr-modal-title">رمز QR</h3></div>
    <div class="qr-modal-body">
      <p id="qr-modal-sub"></p>
      <div id="qr-display"></div>
      <div class="qr-url" id="qr-modal-url"></div>
    </div>
    <div class="modal-qr-foot">
      <button class="btn btn-close-m" onclick="closeQRModal()">إغلاق</button>
      <button class="btn btn-print"   onclick="printQR()">🖨 طباعة</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
// ── حماية: مسؤول فقط ──────────────────────────────────────
if (!Auth.check('admin')) { /* redirect */ }
document.getElementById('org-name').textContent = CONFIG.ORG_NAME;

let selectedWS    = null;
let allWorkshops  = [];
let allQRList     = [];
let currentQRUrl  = '';
let confirmAction = null;

window.addEventListener('load', loadWorkshops);

// ══ الورش ═══════════════════════════════════════════════
async function loadWorkshops() {
  const res = await apiCall({ action:'getWorkshops' });
  allWorkshops = res.workshops || [];
  const el = document.getElementById('ws-list');
  if (!allWorkshops.length) { el.innerHTML = '<div class="empty">لا توجد ورش — أنشئي من اليمين</div>'; return; }
  el.innerHTML = allWorkshops.map(w => `
    <div class="ws-item ${selectedWS===w.workshop_id?'selected':''}" id="ws-${w.workshop_id}" onclick="selectWS('${w.workshop_id}')">
      <div class="ws-icon">${w.status==='مؤرشفة'?'🗂':'📁'}</div>
      <div class="ws-info">
        <div class="ws-name">${escHtml(w.name)}</div>
        <div class="ws-meta">${w.start_date} ← ${w.end_date} ${w.status==='مؤرشفة'?'<span class="badge badge-archived">مؤرشفة</span>':''}</div>
      </div>
      <div class="ws-actions" onclick="event.stopPropagation()">
        <button class="btn-sm btn-edit-sm" onclick="editWS('${w.workshop_id}')">✏️</button>
        <button class="btn-sm btn-edit-sm btn-archive" onclick="archiveWS('${w.workshop_id}','${escHtml(w.name)}')">🗂</button>
        <button class="btn-sm btn-del-sm"  onclick="deleteWS('${w.workshop_id}','${escHtml(w.name)}')">🗑</button>
      </div>
    </div>`).join('');
}

function selectWS(id) {
  selectedWS = id;
  const ws = allWorkshops.find(w => w.workshop_id === id);
  document.querySelectorAll('.ws-item').forEach(e => e.classList.remove('selected'));
  document.getElementById('ws-' + id)?.classList.add('selected');
  document.getElementById('qr-section').style.display = '';
  document.getElementById('qr-ws-name').textContent = ws?.name || '';
  loadQRList(id);
}

async function saveWorkshop() {
  const name  = document.getElementById('ws-name').value.trim();
  const editId= document.getElementById('edit-ws-id').value;
  if (!name) { showToast('ws-toast','أدخلي اسم الورشة','error'); return; }

  if (editId) {
    const res = await apiCall({ action:'updateWorkshop', workshop_id:editId, name,
      start_date:document.getElementById('ws-start').value,
      end_date  :document.getElementById('ws-end').value,
      location  :document.getElementById('ws-location').value });
    if (res.ok) { showToast('ws-toast','✅ تم تعديل الورشة'); resetWSForm(); loadWorkshops(); }
    else showToast('ws-toast', res.error || 'خطأ','error');
  } else {
    const res = await apiCall({ action:'createWorkshop', name,
      start_date:document.getElementById('ws-start').value,
      end_date  :document.getElementById('ws-end').value,
      location  :document.getElementById('ws-location').value });
    if (res.ok) {
      showToast('ws-toast','✅ تم إنشاء الورشة');
      loadWorkshops();
      ['ws-name','ws-start','ws-end','ws-location'].forEach(id => document.getElementById(id).value='');
    } else showToast('ws-toast', res.error || 'خطأ','error');
  }
}

function editWS(id) {
  const ws = allWorkshops.find(w => w.workshop_id === id);
  if (!ws) return;
  document.getElementById('edit-ws-id').value  = id;
  document.getElementById('ws-name').value      = ws.name;
  document.getElementById('ws-start').value     = ws.start_date;
  document.getElementById('ws-end').value       = ws.end_date;
  document.getElementById('ws-location').value  = ws.location || '';
  document.getElementById('ws-form-title').textContent = '✏️ تعديل الورشة';
  document.getElementById('ws-save-btn').textContent   = '💾 حفظ التعديلات';
  document.getElementById('ws-cancel-btn').style.display = '';
  document.getElementById('ws-form-card').scrollIntoView({behavior:'smooth'});
}

function resetWSForm() {
  document.getElementById('edit-ws-id').value = '';
  ['ws-name','ws-start','ws-end','ws-location'].forEach(id => document.getElementById(id).value='');
  document.getElementById('ws-form-title').textContent = '➕ إنشاء ورشة جديدة';
  document.getElementById('ws-save-btn').textContent   = '💾 حفظ الورشة';
  document.getElementById('ws-cancel-btn').style.display = 'none';
  document.getElementById('dup-warn').classList.remove('show');
}

function archiveWS(id, name) {
  showConfirm('أرشفة الورشة', `هل تريدين أرشفة "${name}"؟ يمكن استعادتها لاحقاً.`,
    async () => {
      const res = await apiCall({ action:'archiveWorkshop', workshop_id:id });
      if (res.ok) loadWorkshops();
    }, '🗂 أرشفة', 'btn-archive');
}

function deleteWS(id, name) {
  showConfirm('حذف الورشة نهائياً', `⚠️ سيتم حذف "${name}" وجميع بياناتها نهائياً. هذا الإجراء لا يمكن التراجع عنه.`,
    async () => {
      const res = await apiCall({ action:'deleteWorkshop', workshop_id:id });
      if (res.ok) { if(selectedWS===id){selectedWS=null; document.getElementById('qr-section').style.display='none';} loadWorkshops(); }
    }, '🗑 حذف نهائي', 'btn-confirm-del');
}

// ── Duplicate Detection للورش ─────────────────────────────
function checkDuplicate() {
  const name = document.getElementById('ws-name').value.trim().toLowerCase();
  const editId = document.getElementById('edit-ws-id').value;
  const dup = allWorkshops.some(w => w.name.toLowerCase() === name && w.workshop_id !== editId);
  document.getElementById('dup-warn').classList.toggle('show', dup && name.length > 2);
}

// ══ QR Codes ═════════════════════════════════════════════
async function loadQRList(wsId) {
  const res = await apiCall({ action:'getQRList', workshop_id: wsId || selectedWS });
  allQRList = res.qr_list || [];
  const el  = document.getElementById('qr-list');
  if (!allQRList.length) { el.innerHTML = '<div class="empty">لا توجد رموز بعد</div>'; return; }
  // جلب اسم الورشة المحددة
  const wsName = allWorkshops.find(w => w.workshop_id === selectedWS)?.name || '';
  el.innerHTML = allQRList.map(q => {
    const label = q.day_name ? q.day_name : wsName;
    return `
    <div class="qr-row">
      <div class="qr-day">${q.day_number}</div>
      <div class="qr-info">
        <div class="qr-title">اليوم ${q.day_number}</div>
        ${label ? `<div class="qr-ws-label">${escHtml(label)}</div>` : ''}
        <div class="qr-date">${q.event_date}</div>
        <div class="qr-att-count" id="att-${q.qr_id}">جارٍ التحميل...</div>
      </div>
      <span class="badge ${q.is_active?'badge-active':'badge-inactive'}">${q.is_active?'مفعّل':'معلّق'}</span>
      <div class="qr-acts">
        <button class="btn-sm ${q.is_active?'btn-deactivate':'btn-activate'}"
          onclick="toggleQR('${q.qr_id}',${!q.is_active})">${q.is_active?'إيقاف':'تفعيل'}</button>
        <button class="btn-sm btn-qr" onclick="viewQR('${q.url}','${q.qr_id}','${q.event_date}')">QR</button>
        <button class="btn-sm btn-del-sm" onclick="deleteQRConfirm('${q.qr_id}',${q.day_number},'${escHtml(label)}')">🗑</button>
      </div>
    </div>`;
  }).join('');
  // جلب عدد الحضور لكل يوم
  allQRList.forEach(q => {
    apiCall({ action:'getAttendanceCount', workshop_id: selectedWS, day_number: q.day_number })
      .then(res => {
        const el = document.getElementById('att-' + q.qr_id);
        if (el) el.textContent = res.ok ? '👥 ' + res.count + ' حاضر' : '';
      }).catch(() => {
        const el = document.getElementById('att-' + q.qr_id);
        if (el) el.textContent = '';
      });
  });
}

function showQRForm() {
  document.getElementById('qr-form-card').style.display = '';
  document.getElementById('qr-form-card').scrollIntoView({behavior:'smooth'});
}

// ── Duplicate Detection للـ QR ────────────────────────────
function checkQRDuplicate() {
  const day  = document.getElementById('qr-day').value;
  const date = document.getElementById('qr-date').value;
  const dup  = allQRList.some(q => String(q.day_number) === String(day) || q.event_date === date);
  document.getElementById('qr-dup-warn').classList.toggle('show', dup);
}

async function createQR() {
  if (!selectedWS) { alert('اختاري ورشة أولاً'); return; }
  const dayName  = document.getElementById('qr-day-name').value.trim();
  const dayDate  = document.getElementById('qr-date').value;       // yyyy-MM-dd
  const fromTime = document.getElementById('qr-from-time').value;  // HH:mm
  const untilTime= document.getElementById('qr-until-time').value; // HH:mm
  const lateTime = document.getElementById('qr-late-time').value;  // HH:mm

  // دمج التاريخ + الوقت → datetime-local string للحفظ في Sheets
  const toDateTime = (date, time) => date && time ? date + 'T' + time : '';

  const res = await apiCall({ action:'createQR', workshop_id:selectedWS,
    day_number : document.getElementById('qr-day').value,
    day_name   : dayName,
    event_date : dayDate,
    valid_from : toDateTime(dayDate, fromTime),
    valid_until: toDateTime(dayDate, untilTime),
    late_after : toDateTime(dayDate, lateTime) });
  if (res.ok) {
    showToast('qr-toast','✅ تم توليد الرمز');
    loadQRList(selectedWS);
    viewQR(res.url, res.qr_id, document.getElementById('qr-date').value);
  } else showToast('qr-toast', res.error || 'خطأ','error');
}

async function toggleQR(qr_id, is_active) {
  await apiCall({ action:'toggleQR', qr_id, is_active });
  loadQRList(selectedWS);
}

function deleteQRConfirm(qr_id, day, wsName) {
  showConfirm(
    'حذف اليوم وبياناته',
    `سيتم حذف اليوم ${day} من ورشة "${wsName}" وجميع سجلات الحضور المرتبطة به بشكل نهائي.

هل أنت متأكدة؟ لا يمكن التراجع عن هذا الإجراء.`,
    async () => {
      const res = await apiCall({ action:'deleteQR', qr_id });
      if (res.ok) {
        showToast('qr-toast',
          res.attendance_cleared
            ? '✅ تم حذف اليوم وجميع سجلات الحضور المرتبطة'
            : '✅ تم حذف اليوم');
        loadQRList(selectedWS);
      } else {
        showToast('qr-toast', '❌ ' + (res.error || 'فشل الحذف'), 'error');
      }
    },
    '🗑 حذف نهائي',
    'btn-confirm-del'
  );
}

// ── عرض QR ───────────────────────────────────────────────
function viewQR(url, id, date) {
  currentQRUrl = url;
  document.getElementById('qr-modal-title').textContent = id;
  document.getElementById('qr-modal-sub').textContent   = date;
  document.getElementById('qr-modal-url').textContent   = url;
  const d = document.getElementById('qr-display');
  d.innerHTML = '';
  new QRCode(d, { text:url, width:200, height:200, correctLevel:QRCode.CorrectLevel.H });
  document.getElementById('qr-modal').classList.add('show');
}
function closeQRModal() { document.getElementById('qr-modal').classList.remove('show'); }
function printQR() {
  const canvas = document.querySelector('#qr-display canvas');
  const img    = canvas ? canvas.toDataURL() : '';
  const wsName = allWorkshops.find(w=>w.workshop_id===selectedWS)?.name || CONFIG.ORG_NAME;
  const w = window.open('');
  w.document.write(`<html><head><title>QR</title>
    <style>body{text-align:center;font-family:Tahoma;padding:40px;direction:rtl}
    h2{color:#02807A;margin-bottom:6px}img{border:2px solid #eee;border-radius:12px;padding:10px;margin:14px 0}
    p{font-size:12px;color:#666;word-break:break-all}</style></head><body>
    <h2>${wsName}</h2>
    <p>${document.getElementById('qr-modal-title').textContent} | ${document.getElementById('qr-modal-sub').textContent}</p>
    <img src="${img}" width="220"><p>${currentQRUrl}</p></body></html>`);
  w.document.close(); setTimeout(()=>w.print(),500);
}

// ── Confirm Modal ─────────────────────────────────────────
function showConfirm(title, body, onOk, btnLabel='تأكيد الحذف', btnClass='btn-confirm-del') {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent  = body;
  const btn = document.getElementById('confirm-ok-btn');
  btn.textContent = btnLabel;
  btn.className   = 'btn ' + btnClass;
  confirmAction   = onOk;
  document.getElementById('confirm-modal').classList.add('show');
}
function closeConfirm() { document.getElementById('confirm-modal').classList.remove('show'); confirmAction=null; }
document.getElementById('confirm-ok-btn').onclick = () => { closeConfirm(); confirmAction && confirmAction(); };

// ── Toast ─────────────────────────────────────────────────
function showToast(id, msg, type='success') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className   = 'toast show' + (type==='error' ? ' error' : '');
  setTimeout(() => el.classList.remove('show'), 3500);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
