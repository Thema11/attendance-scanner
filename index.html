<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>تسجيل الدخول — نظام الحضور</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(150deg,#013330 0%,#02807A 60%,#309C99 100%);
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.card { background:var(--white); border-radius:20px; width:100%; max-width:380px; box-shadow:0 24px 64px rgba(0,0,0,.3); overflow:hidden; }
.card-header {
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  padding:32px 24px 24px; text-align:center; color:#fff;
}
.logo-wrap { width:80px; height:80px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; }
.logo-wrap img { width:100%; height:100%; object-fit:contain; filter:brightness(0) invert(1); }
.card-header h1 { font-size:20px; font-weight:700; margin-bottom:4px; }
.card-header p  { font-size:13px; opacity:.85; }
.card-body { padding:28px 24px; }
.hint { font-size:13px; color:var(--muted); text-align:center; margin-bottom:18px; }
.roles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.role-btn {
  border:2px solid var(--border); border-radius:12px;
  padding:14px 10px; background:#F0FAF9;
  cursor:pointer; text-align:center; transition:all .2s; font-family:inherit;
}
.role-btn:hover   { border-color:var(--teal); }
.role-btn.selected { border-color:var(--teal); background:#ECFDF5; box-shadow:0 0 0 3px rgba(2,128,122,.12); }
.role-icon { font-size:28px; margin-bottom:6px; }
.role-name { font-size:14px; font-weight:700; color:#1A1A1A; }
.role-desc { font-size:11px; color:var(--muted); margin-top:3px; }
label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.input-wrap { position:relative; }
input[type="password"] {
  width:100%; padding:13px 44px 13px 14px;
  border:1.5px solid var(--border); border-radius:10px;
  font-size:16px; font-family:inherit; background:#FAFFFE;
  transition:border-color .2s; text-align:right; letter-spacing:.1em;
}
input[type="password"]:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(2,128,122,.1); }
.toggle-pass { position:absolute; left:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); padding:4px; }
.btn-login {
  width:100%; padding:14px; border:none; border-radius:10px;
  background:var(--teal); color:#fff; font-size:16px; font-weight:700;
  cursor:pointer; font-family:inherit; margin-top:14px; transition:all .2s;
}
.btn-login:hover  { background:#016b66; }
.btn-login:active { transform:scale(.98); }
.error { background:var(--danger-bg); border:1px solid #FCA5A5; border-radius:8px; padding:10px 14px; font-size:13px; color:var(--danger); text-align:center; margin-top:12px; display:none; animation:shake .35s; }
.error.show { display:block; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* login page */
body { background:linear-gradient(150deg,var(--teal-dark) 0%,var(--teal) 60%,var(--teal-light) 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { background:var(--bg-card); border-radius:var(--radius-xl); width:100%; max-width:380px; box-shadow:0 24px 64px rgba(0,0,0,.28); overflow:hidden; }
.card-header { background:linear-gradient(135deg,var(--teal-dark),var(--teal)); padding:30px 24px 22px; text-align:center; color:#fff; }
.logo-wrap { width:76px; height:76px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; }
.logo-wrap img { width:100%; height:100%; object-fit:contain; filter:brightness(0) invert(1); }
.card-header h1 { font-size:20px; font-weight:700; margin-bottom:3px; }
.card-header p  { font-size:13px; opacity:.84; }
.card-body { padding:26px 22px; }
.hint { font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:16px; }
.roles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.role-btn { border:2px solid var(--border); border-radius:var(--radius-md); padding:14px 10px; background:var(--bg-sidebar); cursor:pointer; text-align:center; transition:var(--transition); font-family:var(--font); }
.role-btn:hover   { border-color:var(--teal-light); background:var(--teal-pale); }
.role-btn.selected { border-color:var(--teal); background:var(--teal-pale); box-shadow:0 0 0 3px rgba(2,128,122,.1); }
.role-icon { font-size:26px; margin-bottom:6px; }
.role-name { font-size:14px; font-weight:700; color:var(--text-primary); }
.role-desc { font-size:11px; color:var(--text-muted); margin-top:2px; }
.input-wrap { position:relative; }
.toggle-pass { position:absolute; left:11px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-muted); padding:4px; }
.btn-login { width:100%; padding:13px; border:none; border-radius:var(--radius); background:var(--teal); color:#fff; font-size:15px; font-weight:700; cursor:pointer; font-family:var(--font); margin-top:13px; transition:var(--transition); }
.btn-login:hover { background:var(--teal-dark); }
.btn-login:active { transform:scale(.98); }
.error { background:var(--danger-bg); border:1px solid var(--danger-bdr); border-radius:var(--radius); padding:10px 14px; font-size:13px; color:var(--danger); text-align:center; margin-top:11px; display:none; animation:shake .35s; }
.error.show { display:block; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo-wrap">
      <img src="logo.svg" alt="شعار النيابة العامة">
    </div>
    <h1 id="sys-name">نظام تسجيل الحضور</h1>
    <p id="org-name">النيابة العامة</p>
  </div>
  <div class="card-body">
    <p class="hint">اختر دورك ثم أدخل كلمة المرور</p>
    <div class="roles">
      <button class="role-btn selected" id="role-admin" onclick="selectRole('admin')">
        <div class="role-icon">⚙️</div>
        <div class="role-name">مسؤول</div>
        <div class="role-desc">إدارة كاملة</div>
      </button>
      <button class="role-btn" id="role-organizer" onclick="selectRole('organizer')">
        <div class="role-icon">📷</div>
        <div class="role-name">منظم</div>
        <div class="role-desc">تسجيل الحضور</div>
      </button>
    </div>
    <label>كلمة المرور</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')login()">
      <button class="toggle-pass" onclick="togglePass()" type="button">👁</button>
    </div>
    <button class="btn-login" onclick="login()">دخول</button>
    <div class="error" id="error">كلمة المرور غير صحيحة</div>
  </div>
</div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
document.getElementById('sys-name').textContent = CONFIG.SYSTEM_NAME;
document.getElementById('org-name').textContent = CONFIG.ORG_NAME;

// إذا كان مسجلاً — وجّهيه مباشرة
if (sessionStorage.getItem('role') && sessionStorage.getItem('auth')) {
  const role = sessionStorage.getItem('role');
  window.location.href = role === 'admin' ? 'admin.html' : 'scanner.html';
}

let selectedRole = 'admin';

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('role-' + role).classList.add('selected');
  document.getElementById('password').value = '';
  document.getElementById('password').focus();
}

function login() {
  const pass = document.getElementById('password').value;
  const role = Auth.login(pass);
  if (role) {
    if (role !== selectedRole && role !== 'admin') {
      showError('كلمة المرور غير مطابقة للدور المختار');
      return;
    }
    window.location.href = role === 'admin' ? 'admin.html' : 'scanner.html';
  } else {
    showError('كلمة المرور غير صحيحة');
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('password').value = '';
  setTimeout(() => el.classList.remove('show'), 3500);
}

function togglePass() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
